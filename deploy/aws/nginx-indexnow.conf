# INSERIR dentro do bloco server HTTPS, ANTES do location ~ \.php$.
# Requer root /var/www/projetos/iguatamaonline/public.
# AVISO: fastcgi_pass abaixo usa pool padrão; substitua pelo socket real do pool do site.
# O caminho requisitado continua /<chave>.txt. Nunca libera escrita em public/.
location ~ ^/[a-f0-9]{32}\.txt$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/projetos/iguatamaonline/public/indexnow-key.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_read_timeout 15s;
}
