# URLs amigáveis (/noticia/slug, /categoria/slug, /app/pagina) no Nginx.
# O public/.htaccess só vale para Apache; no Nginx estas regras são obrigatórias
# quando "Usar URLs amigáveis" está ativado no painel. Sem elas, /noticia/slug
# dá 404 e a notícia "não abre" ao clicar.
#
# INSERIR dentro do bloco server HTTPS, ANTES de "location ~ \.php$".
# Substitui o "location /" atual (mantenha apenas um).

location / {
    try_files $uri $uri/ @igua_friendly;
}

location @igua_friendly {
    rewrite ^/(noticia|categoria)/([a-z0-9]+(?:-[a-z0-9]+)*)/?$ /index.php?p=$1&slug=$2 last;
    rewrite ^/([a-z0-9]+(?:-[a-z0-9]+)*)/([a-z0-9]+(?:-[a-z0-9]+)*)/?$ /index.php?p=app&app_slug=$1&app_page=$2 last;
    rewrite ^/([a-z0-9]+(?:-[a-z0-9]+)*)/?$ /index.php?p=app&app_slug=$1 last;
    return 404;
}

# Depois: sudo nginx -t && sudo systemctl reload nginx
# Teste: curl -I https://SEU-DOMINIO/noticia/slug-de-uma-noticia  (esperado: 200)
