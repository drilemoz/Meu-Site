# Rotas públicas do IguaNews para Nginx.
# Inclua este arquivo DENTRO do bloco server HTTPS do portal.
# Deve coexistir com o location PHP já existente (location ~ \.php$).
# Arquivos e diretórios reais continuam sendo servidos diretamente;
# URLs /noticia/slug e /categoria/slug seguem para o front controller.
location / {
    try_files $uri $uri/ /index.php?$query_string;
}
