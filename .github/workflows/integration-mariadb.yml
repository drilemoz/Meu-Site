name: Integracao MariaDB backup e restore
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'app/**'
      - 'public/**'
      - 'bin/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'RELEASE_NOTES.md'
      - 'github-manager.json'
      - 'app_identity.json'
      - '.github/workflows/integration-mariadb.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: temporary-ci-root-only
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: igua_ci_backup134
          MARIADB_USER: igua_ci_runner
          MARIADB_PASSWORD: temporary-ci-database-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP e extensoes reais
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql php-zip
          php -m | grep -E 'pdo_mysql|zip' -i
      - name: Sintaxe e regressao PHP
        run: |
          set -e
          find app public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          for file in tests/*.php; do php "$file" > /dev/null; done
      - name: Regressao JavaScript e CSS
        run: |
          set -e
          # Os oito trechos do editor formam uma unica IIFE; apenas o JS final e valido isoladamente.
          find public/assets/js -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          find tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          for file in tests/*.js; do node "$file" > /dev/null; done
          python3 tools/build_css.py --check
          python3 tools/build_news_editor.py --check
          python3 tools/audit_project.py
      - name: Upload segmentado em PHP 2M/8M (15 MiB)
        run: |
          php tests/chunked_upload_150.php
          node tests/setup_backup_upload_150.js
          python3 tools/test_chunked_upload_150.py --full
      - name: Integracao isolada MariaDB e ZipArchive
        env:
          IGUA_TEST_ALLOW_WRITE: YES_ISOLATED_DB
          IGUA_TEST_DB_HOST: 127.0.0.1
          IGUA_TEST_DB_PORT: '3306'
          IGUA_TEST_DB_NAME: igua_ci_backup134
          IGUA_TEST_DB_USER: igua_ci_runner
          IGUA_TEST_DB_PASSWORD: temporary-ci-database-only
        run: |
          php tests/integration/restore_mariadb_134.php
          php tests/integration/remember_mariadb_140.php
          php tests/integration/elections_mariadb_141.php
          php tests/integration/news_indexes_mariadb_146.php
          php tests/integration/legal_apps_mariadb_196.php
          php tests/integration/teixeira_mariadb_206.php
      - name: Provisionamento MySQL local em banco isolado
        # GitHub Actions publica a porta Docker no runner, mas a conexão vinda do
        # runner aparece no MariaDB como IP do gateway (ex.: 172.18.0.1).
        # A conta criada pelo portal é LOCAL e não aceita esse IP, por projeto.
        # Executar SOMENTE este ensaio no namespace de rede do serviço MariaDB:
        # 127.0.0.1 passa a ser realmente o loopback do banco, sem GRANT para '%'.
        shell: bash
        env:
          CI: 'true'
          IGUA_TEST_ALLOW_WRITE: YES_ISOLATED_DB
          IGUA_TEST_ADMIN_HOST: 127.0.0.1
          IGUA_TEST_ADMIN_USER: root
          IGUA_TEST_ADMIN_PASSWORD: temporary-ci-root-only
          IGUA_TEST_MARIADB_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          set -euo pipefail
          if [[ ! "$IGUA_TEST_MARIADB_CONTAINER" =~ ^[a-f0-9]{12,64}$ ]]; then
            echo 'ID do contêiner MariaDB inválido/indisponível; ensaio interrompido.' >&2
            exit 1
          fi
          service_pid="$(docker inspect --format '{{.State.Pid}}' "$IGUA_TEST_MARIADB_CONTAINER")"
          if [[ ! "$service_pid" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Processo do MariaDB não está ativo; ensaio interrompido.' >&2
            exit 1
          fi
          # nsenter troca APENAS a rede. PHP, código, filesystem e extensão
          # pdo_mysql continuam os mesmos do runner ubuntu-24.04.
          sudo --preserve-env=CI,IGUA_TEST_ALLOW_WRITE,IGUA_TEST_ADMIN_HOST,IGUA_TEST_ADMIN_USER,IGUA_TEST_ADMIN_PASSWORD \
            nsenter --target "$service_pid" --net -- php tests/integration/installer_create_mariadb_231.php
      - name: Ciclo integrado do atualizador ZIP com MariaDB isolado
        env:
          IGUA_TEST_ALLOW_WRITE: YES_ISOLATED_DB
          IGUA_TEST_DB_HOST: 127.0.0.1
          IGUA_TEST_DB_PORT: '3306'
          IGUA_TEST_DB_NAME: igua_ci_backup134
          IGUA_TEST_DB_USER: igua_ci_runner
          IGUA_TEST_DB_PASSWORD: temporary-ci-database-only
        run: |
          php tests/integration/updater_mariadb_217.php

  publicar_release:
    name: Publicar Release apos todos os testes
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: meu-site-release-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout da versao validada
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Conferir versao, tag e Release existentes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'VERSION invalida: use X.Y.Z' >&2
            exit 1
          fi
          tag="v${version}"
          expected="Atualizacao-v${version}.zip"
          # Somente uma nova VERSION enviada via GitHub Manager deve publicar.
          previous="$(git show HEAD^:VERSION 2>/dev/null | tr -d '\r\n' || true)"
          if [[ "$previous" == "$version" ]]; then
            echo "VERSION nao mudou (${version}); validacao apenas, sem nova Release."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt" 2>/dev/null; then
            if grep -Fxq "$expected" "$RUNNER_TEMP/release-assets.txt"; then
              echo "Release ${tag} ja publicada com ${expected}; sem duplicar."
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release ${tag} ja existe, mas nao tem ${expected}. Revisao manual necessaria." >&2
            exit 1
          fi
          if git ls-remote --tags --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} existe sem Release. Nao sobrescrever tags automaticamente." >&2
            exit 1
          fi
          # Nunca sobrescrever/republicar uma versao anterior ao ultimo release.
          latest="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            latest_version="${latest#v}"
            newest="$(printf '%s\n%s\n' "$latest_version" "$version" | sort -V | tail -n 1)"
            if [[ "$newest" != "$version" || "$latest_version" == "$version" ]]; then
              echo "Nao publicar versao ${version}: ultima Release e ${latest_version}." >&2
              exit 1
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Gerar ZIP de atualizacao a partir do commit aprovado
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python3 tools/build_update_package.py --output "$RUNNER_TEMP/Atualizacao-v${VERSION}.zip"
      - name: Verificar manifesto e hashes do ZIP
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - "$RUNNER_TEMP/Atualizacao-v${VERSION}.zip" "$VERSION" <<'PYCODE'
          import hashlib,json,sys,zipfile
          file,version=sys.argv[1:]
          with zipfile.ZipFile(file) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('release.json'))
              assert manifest['format']=='meu-site-update-v2'
              assert manifest['version']==version
              assert len(manifest['files'])>0
              assert len(z.namelist())==len(manifest['files'])+1
              names=set()
              for item in manifest['files']:
                  name=item['path']
                  assert name not in names and (name=='VERSION' or name.startswith(('app/','public/')))
                  assert not name.startswith('public/uploads/')
                  data=z.read(name)
                  assert len(data)==item['size']
                  assert hashlib.sha256(data).hexdigest()==item['sha256']
                  names.add(name)
          print('Manifesto e hashes SHA-256 confirmados para',version)
          PYCODE
      - name: Publicar Release e anexar ZIP
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$RUNNER_TEMP/Atualizacao-v${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Meu Site v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --latest
